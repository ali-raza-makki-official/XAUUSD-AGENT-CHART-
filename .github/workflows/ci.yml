name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (core, desktop main process)
        run: npm test
      - name: Build (electron-vite)
        run: npm run build
      - name: Package unpacked app (Linux smoke build, proves the packaging config resolves)
        run: npm run pack -w @aurum/desktop
      - name: Verify Electron security fuses in the packaged binary
        run: npm run verify:fuses -w @aurum/desktop
